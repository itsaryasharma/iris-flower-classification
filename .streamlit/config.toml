# Light and dark appearance. Defining both [theme.light] and [theme.dark]
# enables Streamlit's built-in theme switch (menu -> Settings -> Theme).
# Theme colours cannot be changed from Python code, so they live here.

[theme]
baseRadius = "0.6rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#7C3AED"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F3FF"
textColor = "#111827"
borderColor = "#D1D5DB"

[theme.dark]
primaryColor = "#8B5CF6"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1C1830"
textColor = "#E5E7EB"
borderColor = "#374151"

[browser]
gatherUsageStats = false
